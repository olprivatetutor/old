services:
  app:
    image: ghcr.io/dev-keuber/kaifa-fe:latest
    container_name: kaifa-fe
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
