name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dev-keuber/kaifa-fe:latest
            ghcr.io/dev-keuber/kaifa-fe:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            set -e

            # Pull image terbaru dari GHCR
            echo "${GHCR_PAT}" | docker login ghcr.io -u dev-keuber --password-stdin
            docker pull ghcr.io/dev-keuber/kaifa-fe:latest

            cd /opt/kaifa/kaifa-fe
            docker compose up -d --remove-orphans
            docker compose ps
            echo "Deploy complete: $(date)"
