name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dev-keuber/kaifa-be:latest
            ghcr.io/dev-keuber/kaifa-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OPENAI_API_KEY,DEEPGRAM_API_KEY,ELEVENLABS_API_KEY,ELEVENLABS_VOICE_ID,JWT_SECRET,DB_PASSWORD,GHCR_PAT
          script: |
            set -e

            # Tulis .env dari GitHub Secrets
            cat > /opt/kaifa/kaifa-be/.env <<EOF
            PORT=8080
            ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
            ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
            ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
            JWT_SECRET=${JWT_SECRET}
            DB_NAME=kaifa
            DB_USER=kaifa
            DB_PASSWORD=${DB_PASSWORD}
            DATABASE_URL=postgres://kaifa:${DB_PASSWORD}@postgres:5432/kaifa
            EOF

            # Pull image terbaru dari GHCR
            echo "${GHCR_PAT}" | docker login ghcr.io -u dev-keuber --password-stdin
            docker pull ghcr.io/dev-keuber/kaifa-be:latest

            # Sync nginx config
            cd /opt/kaifa/kaifa-be
            cp nginx/kaifa.conf /etc/nginx/sites-available/kaifa
            nginx -t && systemctl reload nginx

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            echo "Deploy complete: $(date)"
