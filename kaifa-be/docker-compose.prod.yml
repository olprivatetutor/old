services:
  api:
    image: ghcr.io/dev-keuber/kaifa-be:latest
    container_name: kaifa-be
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${DB_USER:-kaifa}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kaifa}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kaifa-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: kaifa-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-kaifa}
      POSTGRES_USER: ${DB_USER:-kaifa}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kaifa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kaifa} -d ${DB_NAME:-kaifa}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  kaifa-network:
    driver: bridge
