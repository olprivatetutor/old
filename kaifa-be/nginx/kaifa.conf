# HTTP → HTTPS redirect (both domains)
server {
    listen 80;
    server_name api.kaifanesia.com demo.kaifanesia.com;
    return 301 https://$host$request_uri;
}

# Backend API — api.kaifanesia.com
server {
    listen 443 ssl;
    server_name api.kaifanesia.com;

    ssl_certificate     /etc/letsencrypt/live/api.kaifanesia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kaifanesia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

# Frontend — demo.kaifanesia.com
server {
    listen 443 ssl;
    server_name demo.kaifanesia.com;

    ssl_certificate     /etc/letsencrypt/live/demo.kaifanesia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.kaifanesia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
